name: Monitor diario del DOF

on:
  workflow_dispatch:
    inputs:
      publication_date:
        description: Fecha de publicación a recuperar, con formato AAAA-MM-DD.
        required: false
        type: string
  schedule:
    - cron: "17 16 * * *"

permissions:
  contents: read

concurrency:
  group: dof-monitor-publication
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publication_date: ${{ steps.context.outputs.publication_date }}
    steps:
      - name: Recuperar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Determinar fecha de publicación
        id: context
        shell: bash
        env:
          PUBLICATION_DATE: ${{ inputs.publication_date }}
        run: |
          publication_date="${PUBLICATION_DATE:-$(date -u +%F)}"
          if ! [[ "$publication_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -u -d "$publication_date" +%F >/dev/null; then
            echo "La fecha debe tener formato ISO AAAA-MM-DD y ser válida." >&2
            exit 2
          fi
          printf 'publication_date=%s\n' "$publication_date" >> "$GITHUB_OUTPUT"

      - name: Sincronizar SIDOF con respaldo DOF
        run: |
          python3 -m dof_diff_lab.intelligence sync \
            --date "${{ steps.context.outputs.publication_date }}" \
            --root .

      - name: Construir corpus local consultable
        run: |
          python3 -m dof_diff_lab.intelligence build \
            --root . \
            --database .tmp/dof-corpus.sqlite3

      - name: Conservar derivados verificados de la corrida
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dof-monitor-${{ steps.context.outputs.publication_date }}-${{ github.run_id }}
          path: |
            data/normalized/
            data/manifests/
            data/diffs/
            data/state/
            site/
            .tmp/dof-corpus.sqlite3
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Recuperar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Recuperar derivados verificados
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dof-monitor-${{ needs.capture.outputs.publication_date }}-${{ github.run_id }}
          path: .

      - name: Publicar artefactos versionados cuando cambien
        shell: bash
        run: |
          if git diff --quiet -- data site; then
            echo "El catálogo normalizado no cambió; no se crea un commit."
            exit 0
          fi
          git config user.name "dof-monitor[bot]"
          git config user.email "dof-monitor[bot]@users.noreply.github.com"
          git add data site
          git commit -m "data: monitor DOF ${{ needs.capture.outputs.publication_date }}"
          git push

  deploy:
    needs: [capture, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperar derivados verificados
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dof-monitor-${{ needs.capture.outputs.publication_date }}-${{ github.run_id }}
          path: .

      - name: Configurar publicación estática
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: true

      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

      - name: Desplegar sitio en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
